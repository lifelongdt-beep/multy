# Echo Rush — 안드로이드 앱 자동 빌드
# main에 병합되거나 Actions 탭에서 'Run workflow'를 누르면, 게임 파일을 앱에 넣어 만든다.
#  - echo-rush-test.apk : 폰에 바로 깔아 보는 시험용 (스토어용 아님)
#  - echo-rush-release.aab : 구글 플레이에 올리는 파일 (아래 비밀 값 4개를 넣어야 서명됨)
# 비밀 값(Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_ALIAS · ANDROID_KEY_PASSWORD
name: Android build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]   # 병합 요청을 만들면 미리 빌드해 확인
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle   # 내려받은 라이브러리를 저장해 두고 다시 씀 (라이브러리 서버의 '요청이 너무 많음' 거절을 피함)
      - name: 게임 파일 모으고 앱에 넣기
        env:
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          npm ci
          npm test
          npm run build:web
          npx cap sync android
      - name: 출시용 서명 열쇠 준비 (비밀 값이 있을 때만)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "서명 비밀 값이 없어 출시용 파일은 서명 없이 만듭니다 (시험용 APK는 그대로 설치 가능)."
            exit 0
          fi
          # 붙여 넣을 때 섞인 공백·줄바꿈은 지움
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          KS_PW=$(trim "$KS_PW"); KEY_ALIAS=$(trim "$KEY_ALIAS"); KEY_PW=$(trim "$KEY_PW")
          printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.keystore" || { echo "::error::ANDROID_KEYSTORE_BASE64 값이 올바르지 않아요. 1-ANDROID_KEYSTORE_BASE64.txt 내용 전체를 다시 넣어 주세요."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PW" >/dev/null 2>&1 || { echo "::error::ANDROID_KEYSTORE_PASSWORD 가 키 파일과 맞지 않아요. 2-ANDROID_KEYSTORE_PASSWORD.txt 내용만 다시 넣어 주세요."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PW" -alias "$KEY_ALIAS" >/dev/null 2>&1 || { echo "::error::ANDROID_KEY_ALIAS 가 키 파일에 없어요. 3-ANDROID_KEY_ALIAS.txt 내용(upload)만 넣어 주세요."; exit 1; }
          # PKCS12 키 파일은 키 비밀번호 = 키 파일 비밀번호 (따로 넣은 값이 달라도 키 파일 비밀번호를 씀)
          if keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PW" 2>/dev/null | grep -qi 'PKCS12' || [ -z "$KEY_PW" ]; then KEY_PW="$KS_PW"; fi
          echo "서명 키 확인 완료"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PW"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PW"
          } >> "$GITHUB_ENV"
      - name: 앱 만들기
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/echo-rush-test.apk
          cp app/build/outputs/bundle/release/app-release.aab ../out/echo-rush-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: echo-rush-android-${{ github.run_number }}
          path: out/
