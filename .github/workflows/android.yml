# Echo Rush — 안드로이드 앱 자동 빌드
# main에 병합되거나 Actions 탭에서 'Run workflow'를 누르면, 게임 파일을 앱에 넣어 만든다.
#  - echo-rush-test.apk : 폰에 바로 깔아 보는 시험용 (스토어용 아님)
#  - echo-rush-release.aab : 구글 플레이에 올리는 파일 (아래 비밀 값 4개를 넣어야 서명됨)
# 비밀 값(Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_ALIAS · ANDROID_KEY_PASSWORD
name: Android build
on:
  push:
    branches: [main, 'ccr-*']   # 작업 브랜치에서도 미리 빌드해 확인
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 게임 파일 모으고 앱에 넣기
        run: |
          npm ci
          npm test
          npm run build:web
          npx cap sync android
      - name: 출시용 서명 열쇠 준비 (비밀 값이 있을 때만)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "서명 비밀 값이 없어 출시용 파일은 서명 없이 만듭니다 (시험용 APK는 그대로 설치 가능)."
          fi
      - name: 앱 만들기
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/echo-rush-test.apk
          cp app/build/outputs/bundle/release/app-release.aab ../out/echo-rush-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: echo-rush-android-${{ github.run_number }}
          path: out/
