<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Endless Me</title>
<style>
  html,body{margin:0;height:100%;background:#0d0f1a;color:#fff;font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:360px;height:640px}
  canvas{width:100%;height:100%;display:block;background:#161a2e;border-radius:6px}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(8,10,20,.82);text-align:center;padding:24px;box-sizing:border-box}
  .overlay.hidden{display:none}
  h1{margin:0;font-size:28px} h2{margin:0;font-size:22px}
  p{margin:0;opacity:.8;font-size:14px;line-height:1.5}
  button{font:inherit;font-size:16px;font-weight:700;border:0;border-radius:12px;padding:14px 22px;background:#6c8cff;color:#fff;cursor:pointer;min-width:200px}
  button.sub{background:#2a2f4a;font-size:13px;padding:8px 14px;min-width:0;font-weight:500}
  .card{background:#222845;border:2px solid #3a4272;text-align:left;min-width:280px;margin-bottom:8px}
  .card small{display:block;font-weight:400;opacity:.8;margin-top:2px}
  .card.syn{border-color:#ffd34d}
  #stats{font-size:15px;line-height:1.7}
  .big{font-size:40px;font-weight:800;color:#8fe3ff}
  .row{display:flex;gap:8px}
  #coinbar{font-size:16px;background:#222845;border:2px solid #3a4272;border-radius:20px;padding:4px 14px}
  .panel{justify-content:flex-start;overflow-y:auto;touch-action:pan-y;gap:8px;padding-top:16px;padding-bottom:16px}
  #pbody{width:100%;display:flex;flex-direction:column;gap:8px}
  .item{background:#222845;border:2px solid #3a4272;border-radius:12px;padding:10px;text-align:left;display:flex;align-items:center;gap:10px;font-size:14px}
  .item.done{border-color:#4fd18b;opacity:.85}
  .item.sel{border-color:#ffd34d}
  .item .grow{flex:1;min-width:0}
  .item small{display:block;opacity:.75;font-size:12px;margin-top:2px;line-height:1.35}
  .item .icon{font-size:26px}
  .book{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;font-size:13px;align-items:center;background:#222845;border:2px solid #3a4272;border-radius:12px;padding:8px}
  .book .cell{text-align:center;border-radius:8px;padding:3px 0;background:#0003}
  .book .cell.got{background:rgba(255,140,190,.18)}
  .book .cell small{display:block;font-size:10px;opacity:.75}
  .book .wn{font-size:12px;text-align:left;white-space:nowrap}
  .item button{min-width:78px;padding:8px 10px;font-size:13px}
  .item button:disabled{opacity:.4;cursor:default}
  .bar{height:6px;background:#0008;border-radius:3px;margin-top:5px;overflow:hidden}
  .bar>i{display:block;height:100%;background:#7dffb2}
  textarea{width:100%;box-sizing:border-box;height:84px;background:#0d0f1a;color:#fff;border:2px solid #3a4272;border-radius:8px;font-size:11px;padding:6px;user-select:text;-webkit-user-select:text;touch-action:auto}
  .msg{font-size:13px;color:#ffd34d;min-height:18px}
  #mute{position:absolute;right:6px;top:5.4%;z-index:5;background:#0004;font-size:13px;padding:3px 7px;min-width:0;border-radius:8px}
  /* 레벨업·조언 카드: 게임을 멈추지 않는 작은 반투명 카드 (아래 조작 영역 = 적이 거의 없는 곳). 빈 곳은 터치가 그대로 게임으로 간다 */
  #cards{position:absolute;left:10px;right:10px;bottom:1.2%;z-index:6;pointer-events:none;display:flex;flex-direction:column;gap:3px}
  #cards.hidden{display:none}
  #cards .ctitle.hidden{display:none}
  #cards .ctitle{font-size:11px;text-align:center;color:#ffe58a;text-shadow:0 1px 2px #000;opacity:.9}
  #cards .crow{display:flex;gap:8px}
  #cards .mini{pointer-events:auto;flex:1;min-width:0;padding:4px 3px;border-radius:12px;background:rgba(30,36,64,.12);border:2px solid rgba(108,140,255,.5);opacity:.6;color:#fff;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.15;touch-action:none;text-shadow:0 1px 2px #000;backdrop-filter:blur(1px)}
  #cards .mini.boon{border-color:rgba(255,211,77,.85)}
  #cards .mini.deed{border-color:rgba(255,140,190,.9)}
  #cards .mini:active{background:rgba(108,140,255,.5)}
  #cards .mini .ic{font-size:24px;line-height:1.1}
  #cards .mini .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  #cards .mini small{font-size:9px;font-weight:400;opacity:.85;white-space:nowrap}
  #cards .ctime{height:3px;background:#0006;border-radius:2px;overflow:hidden}
  #cards .ctime>i{display:block;height:100%;background:#ffd34d}
  #pauseBtn{position:absolute;right:44px;top:5.4%;z-index:5;background:#0004;font-size:13px;padding:3px 7px;min-width:0;border-radius:8px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c"></canvas>
  <button id="mute" class="sub">🔊</button>
  <button id="pauseBtn" class="sub" style="display:none" aria-label="일시정지">⏸</button>

  <div id="tutorial" class="overlay hidden">
    <h1>👻 Endless Me</h1>
    <p>처음 오셨군요! 반가워요 👋</p>
    <p>이 게임에서는 한 판이 끝나면<br><b>그 판의 내가 유령(에코)이 되어</b><br>다음 판에서 함께 싸워요.</p>
    <p>먼저 <b>과거의 나 10명</b>과 함께<br>한 판을 체험해 볼까요?</p>
    <button id="tStart">📘 튜토리얼 시작</button>
    <button id="tSkip" class="sub">건너뛰기</button>
  </div>

  <div id="pause" class="overlay hidden">
    <h2>⏸ 일시정지</h2>
    <p id="pauseInfo"></p>
    <button id="resume">▶ 계속하기</button>
    <button id="artBtn" class="sub">🎨 그림체: 새 그림체</button>
    <button id="quit" class="sub">🏳️ 그만하고 메뉴로</button>
  </div>

  <div id="start" class="overlay">
    <h1>👻 Endless Me</h1>
    <div style="display:flex;align-items:center;gap:6px"><canvas id="outfitPv" width="112" height="140" style="width:56px;height:70px;background:transparent;border-radius:0"></canvas><span id="outfitName" style="font-size:13px;color:#ffe58a"></span></div>
    <div id="titleLine" style="font-size:12px;color:#ffb3d4;margin-top:-6px"></div>
    <div id="coinbar">🎓 <b id="coins">0</b> 학점</div>
    <button id="bWorld" class="sub" style="min-width:200px;font-size:15px;padding:10px 14px">🗺️ 월드</button>
    <button id="go">시작</button>
    <div class="row"><button id="bShop" class="sub">🏪 상점</button><button id="bChar" class="sub">🧑 캐릭터</button><button id="bDeed" class="sub">💛 선행</button></div>
    <div class="row"><button id="bQuest" class="sub">🏆 과제·미션</button><button id="bBackup" class="sub">💾 백업</button></div>
    <div class="row"><button id="bTutorial" class="sub">📘 튜토리얼</button><button id="reset" class="sub">에코 기록 초기화</button></div>
  </div>

  <div id="panel" class="overlay panel hidden">
    <h2 id="ptitle"></h2>
    <div id="coinline">🎓 <b id="pcoins">0</b> 학점</div>
    <div id="pbody"></div>
    <button id="pback" class="sub">← 돌아가기</button>
  </div>

  <div id="levelup" class="overlay hidden"><div id="choices"></div></div>
  <div id="cards" class="hidden"></div>

  <div id="end" class="overlay hidden">
    <h2 id="endTitle"></h2>
    <div class="big" id="endEchoes"></div>
    <div id="stats"></div>
    <div id="reward" class="msg" style="font-size:14px;line-height:1.6"></div>
    <div id="cheer" style="font-size:14px;color:#ffe58a;line-height:1.5;padding:0 8px"></div>
    <button id="again">한 판만 더</button>
    <button id="toMenu" class="sub">🏪 메뉴 · 상점</button>
  </div>
</div></div>

<script src="src/worlds.js"></script>
<script src="src/sim.js"></script>
<script src="src/tutorial.js"></script>
<script src="src/meta.js"></script>
<script src="src/audio.js"></script>
<script src="src/music.js"></script>
<script src="src/art.js"></script>
<script src="src/art-worlds.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
