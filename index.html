<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Echo Rush</title>
<!-- 앱처럼 설치 (홈 화면 아이콘 · 전체 화면 · 오프라인) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b2466">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="에코 러시">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- 게임 제목 글씨체: 통통 튀는 두꺼운 게임 글꼴 (Luckiest Guy · Black Han Sans, OFL). 못 불러오면 시스템 굵은 글꼴 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0d0f1a;color:#fff;font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:360px;height:640px}
  canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;background:#0d0f1a}   /* 화면 전체: 게임 칸(9:16) 밖 남는 곳까지 배경으로 채움 */
  #stage{pointer-events:none}   /* 게임 칸 위의 버튼·창만 누를 수 있고, 나머지 터치는 아래 캔버스로 */
  #stage>*{pointer-events:auto}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(8,10,20,.82);box-shadow:0 0 0 200vmax rgba(8,10,20,.82);text-align:center;padding:24px;box-sizing:border-box}
  .overlay.hidden{display:none}
  /* 게임 밖 화면: 뒤의 메뉴 배경(해 질 녘 길 · 주인공 · 에코)이 비쳐 보이게 옅게 */
  #start,#tutorial{background:rgba(8,10,24,.2);box-shadow:0 0 0 200vmax rgba(8,10,24,.2)}   /* 그림자 테두리로 같은 옅은 덮개를 게임 칸 밖까지 (긴 폰·태블릿에서 경계선이 안 보이게) */
  #end{background:rgba(8,10,24,.42);box-shadow:0 0 0 200vmax rgba(8,10,24,.42)}
  #panel{background:rgba(8,10,24,.62);box-shadow:0 0 0 200vmax rgba(8,10,24,.62)}
  .icn{vertical-align:-3px;flex-shrink:0}
  .tabs{display:flex;gap:6px;width:100%}
  .dex{width:100%;background:#222845;border:2px solid #3a4272;border-radius:12px;padding:6px 8px;box-sizing:border-box}
  .dex .dn{font-size:13px;font-weight:700;color:#ffe58a;margin-bottom:4px}
  .dex .dc{display:flex;gap:5px;flex-wrap:wrap}
  .dex .dx{display:flex;flex-direction:column;align-items:center;background:#0003;border-radius:8px;padding:2px 3px;cursor:pointer;border:2px solid transparent}
  .dex .dx.cur{border-color:#ffd34d}
  .dex .dx.pv,.omap .oc.pv{border-color:#6fd6ff;box-shadow:0 0 8px #6fd6ff99}
  .dex .dx canvas{width:32px;height:40px;background:transparent;border-radius:0}
  .dex .dx small{font-size:9px;opacity:.8}
  .dex .dx .st{color:#ffd34d;font-size:8px;letter-spacing:-1px}
  .tabs button{flex:1;min-width:0;padding:9px 6px;font-size:14px;background:#2a2f4a;border:2px solid #3a4272}
  .tabs button.on{background:#6c8cff;border-color:#9fb4ff}
  button.badge{position:relative}
  button.badge::after{content:'';position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:#ff4d6d;border:2px solid #0d0f1a}
  button .icn+span{margin-left:6px}
  #mute,#pauseBtn{display:flex;align-items:center;justify-content:center;width:34px;height:30px;padding:0}
  #end{overflow-y:auto;touch-action:pan-y;justify-content:safe center;gap:8px}   /* 보상 줄이 많아도 겹치지 않게 */
  #end>*{flex-shrink:0}
  /* 결과 목록: 맨 아래에 작은 칩으로 한 줄에 2~3개 */
  #reward{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;max-width:330px;font-size:12px;line-height:1.3;min-height:0}
  #reward>div{background:rgba(255,255,255,.07);border:1px solid rgba(255,211,77,.25);border-radius:10px;padding:3px 8px}
  #reward>div.wide{flex-basis:100%;background:rgba(255,211,77,.12)}
  button.danger{color:#ff9aa8;border-color:rgba(255,93,115,.45)}
  #reward>div.deedchip{display:flex;align-items:center;justify-content:center;gap:2px;background:rgba(255,140,192,.12);border-color:rgba(255,140,192,.35)}
  #reward>div.deedchip span{margin-left:4px}
  h1{margin:0;font-size:28px} h2{margin:0;font-size:22px}
  p{margin:0;opacity:.8;font-size:14px;line-height:1.5}
  button{font:inherit;font-size:16px;font-weight:700;border:0;border-radius:12px;padding:14px 22px;background:#6c8cff;color:#fff;cursor:pointer;min-width:200px}
  button.sub{background:#2a2f4a;font-size:13px;padding:8px 14px;min-width:0;font-weight:500}
  .card{background:#222845;border:2px solid #3a4272;text-align:left;min-width:280px;margin-bottom:8px}
  .card small{display:block;font-weight:400;opacity:.8;margin-top:2px}
  .card.syn{border-color:#ffd34d}
  #stats{font-size:15px;line-height:1.7}
  .big{font-size:40px;font-weight:800;color:#8fe3ff}
  .row{display:flex;gap:8px}
  /* 소리 크기: 음악·효과음 슬라이더 (일시정지 화면 + 위 소리 버튼을 누르면 뜨는 작은 창) */
  .vols{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px;margin:4px auto}
  .vol{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
  .vol .vn{width:74px;text-align:left;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:4px}
  .vol input{flex:1;min-width:0;accent-color:#7dffb2;height:22px}
  .vol .vp{width:38px;text-align:right;font-size:12px;opacity:.8;font-weight:400}
  .vol.off .vn,.vol.off .vp{opacity:.45}
  #soundPop{position:absolute;right:6px;top:calc(5.4% + 36px);z-index:8;background:rgba(18,22,44,.96);border:1.5px solid rgba(255,211,77,.45);border-radius:12px;padding:10px 12px 8px;width:230px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
  #soundPop.hidden{display:none}
  .vol .seg{flex:1;display:flex;gap:4px}
  .vol.gfx .vn{flex-direction:column;align-items:flex-start;gap:0;line-height:1.15}
  .vol.gfx .vn small{font-size:10px;font-weight:400;opacity:.7}
  .vol .seg button{flex:1;min-width:0;padding:5px 2px;font-size:11.5px;border-radius:8px;opacity:.6;white-space:nowrap}
  .vol .seg button.on{opacity:1;background:#3fae8a;box-shadow:inset 0 0 0 1.5px #7dffb2}
  #soundPop .vols{margin:0 0 8px}
  #soundPop #muteAll{width:100%;min-width:0;padding:6px;font-size:13px}
  #coinbar{font-size:15px}
  .panel{justify-content:flex-start;overflow-y:auto;touch-action:pan-y;gap:8px;padding-top:16px;padding-bottom:16px}
  #pbody{width:100%;display:flex;flex-direction:column;gap:8px}
  .item{background:#222845;border:2px solid #3a4272;border-radius:12px;padding:10px;text-align:left;display:flex;align-items:center;gap:10px;font-size:14px}
  .item.done{border-color:#4fd18b;opacity:.85}
  .item.sel{border-color:#ffd34d}
  .item .grow{flex:1;min-width:0}
  .item small{display:block;opacity:.75;font-size:12px;margin-top:2px;line-height:1.35}
  .item .icon{font-size:26px}
  .book{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;font-size:13px;align-items:center;background:#222845;border:2px solid #3a4272;border-radius:12px;padding:8px}
  .book .cell{text-align:center;border-radius:8px;padding:3px 0;background:#0003}
  .book .cell.got{background:rgba(255,140,190,.18)}
  .book .cell small{display:block;font-size:10px;opacity:.75}
  .book .cell img.pic{display:block;margin:0 auto}
  .book .cell.head{background:none}
  .sm{font-size:12px;opacity:.85;display:flex;align-items:center;gap:3px;margin-top:2px}
  .deedline{display:flex;align-items:center;justify-content:center;gap:2px}
  /* ---------- 게임 버튼: 입체(아래 두께) · 광택 · 누르면 쑥 들어감 ---------- */
  button{--c1:#86a3ff;--c2:#5576ea;--edge:#2e43a3;position:relative;background:linear-gradient(var(--c1),var(--c2));border:2px solid rgba(10,12,30,.45);
    box-shadow:0 4px 0 var(--edge),0 7px 12px rgba(0,0,0,.35),inset 0 1.5px 0 rgba(255,255,255,.38);text-shadow:0 1.5px 0 rgba(0,0,0,.35);transition:transform .06s,box-shadow .06s}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge),0 3px 6px rgba(0,0,0,.3),inset 0 1.5px 0 rgba(255,255,255,.38)}
  button:disabled{filter:grayscale(.65) brightness(.8);cursor:default}
  button.sub{--c1:#3d4572;--c2:#272c4f;--edge:#141831}
  .tabs button{--c1:#3d4572;--c2:#272c4f;--edge:#141831;background:linear-gradient(var(--c1),var(--c2));border:2px solid rgba(10,12,30,.45)}
  .tabs button.on{--c1:#ffd76a;--c2:#f0a92b;--edge:#a8650f;color:#3a2108;text-shadow:0 1px 0 rgba(255,255,255,.5);border-color:rgba(10,12,30,.45)}
  .gloss::before{content:'';position:absolute;left:7%;right:7%;top:3px;height:40%;border-radius:12px 12px 50% 50%/12px 12px 30% 30%;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,0));pointer-events:none}
  .cicn{filter:drop-shadow(0 2px 0 rgba(0,0,0,.28))}
  .g-gold{--c1:#ffd96e;--c2:#f2a62a;--edge:#a8650f;color:#3a2108;text-shadow:0 1px 0 rgba(255,255,255,.55)}
  .g-blue{--c1:#86b6ff;--c2:#4b78e8;--edge:#2a4aa8}
  .g-pink{--c1:#ffa2c8;--c2:#ec5f97;--edge:#a83565}
  .g-purple{--c1:#bba2ff;--c2:#7d5ae6;--edge:#4c32a0}
  .g-slate{--c1:#97a2c0;--c2:#5d6888;--edge:#353d58}
  .g-teal{--c1:#76e6cf;--c2:#2bab93;--edge:#16705f}
  .g-start{--c1:#8cf5a8;--c2:#26c063;--edge:#147a3a;font-size:26px;font-weight:900;letter-spacing:4px;min-width:250px;padding:12px 22px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:10px;
    animation:goGlow 1.6s ease-in-out infinite}
  @keyframes goGlow{0%,100%{box-shadow:0 5px 0 var(--edge),0 8px 14px rgba(0,0,0,.35),0 0 0 rgba(140,245,168,0),inset 0 1.5px 0 rgba(255,255,255,.45)}50%{box-shadow:0 5px 0 var(--edge),0 8px 14px rgba(0,0,0,.35),0 0 22px rgba(140,245,168,.65),inset 0 1.5px 0 rgba(255,255,255,.45)}}
  .g-start:active{animation:none}
  .g-glass{--c1:rgba(44,50,92,.94);--c2:rgba(24,28,56,.94);--edge:#0c0f22;border:2px solid rgba(255,211,77,.6);min-width:250px;font-size:15px;padding:9px 14px;border-radius:14px}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;border-radius:18px;padding:8px 4px 6px;font-size:16px;font-weight:800;line-height:1.1}
  .tile .icn+span{margin-left:0}
  .tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:290px}
  .tiles2 .tile{height:68px}
  .tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:290px}
  .tiles4 .tile{height:58px;font-size:11.5px;border-radius:14px;padding:5px 2px 4px;letter-spacing:-.3px}
  /* 로고 */
  .logo{display:flex;flex-direction:column;align-items:center;line-height:.86;margin:-8px 0 0;transform-origin:50% 55%;animation:logoBeat 1.3s ease-out infinite}
  /* 제자리에서 심장 뛰듯 '두둥 두둥': 짧게 두 번 커졌다가 쉼 */
  @keyframes logoBeat{0%{transform:scale(1)}12%{transform:scale(1.09)}24%{transform:scale(.99)}36%{transform:scale(1.06)}52%,100%{transform:scale(1)}}
  .logo .lg1,.logo .lg2{font-family:'Luckiest Guy','Arial Black','Apple SD Gothic Neo',sans-serif;font-weight:400;letter-spacing:4px;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #2a1608;paint-order:stroke fill;
    filter:drop-shadow(0 5px 0 #2a1608) drop-shadow(0 9px 12px rgba(0,0,0,.5))}
  .logo .lg1{font-size:64px;background-image:linear-gradient(#fffbe0,#ffd34d 45%,#ff8a2c)}
  .logo .lg2{font-size:78px;background-image:linear-gradient(#f0fbff,#8fd8ff 45%,#4f6cff);margin-top:-6px}
  .logo .lgk{font-family:'Black Han Sans','Apple SD Gothic Neo',sans-serif;font-size:17px;font-weight:400;letter-spacing:6px;color:#ffe58a;margin-top:6px;text-shadow:2px 0 0 #2a1608,-2px 0 0 #2a1608,0 2px 0 #2a1608,0 -2px 0 #2a1608,0 4px 0 #2a1608}
  /* 학점 */
  .pill{display:flex;align-items:center;gap:6px;background:linear-gradient(rgba(44,50,92,.95),rgba(22,26,52,.95));border:2px solid #ffc83d;border-radius:22px;padding:3px 16px 3px 6px;box-shadow:0 3px 0 #0c0f22,inset 0 1px 0 rgba(255,255,255,.2);color:#ffe58a}
  .capi{display:inline-flex}
  .capi.grow{animation:capiGrow .7s ease-out}
  @keyframes capiGrow{0%{transform:scale(1)}35%{transform:scale(1.6) rotate(-8deg)}70%{transform:scale(.9)}100%{transform:scale(1)}}
  .pill b{font-size:18px;color:#fff;text-shadow:0 1.5px 0 rgba(0,0,0,.4)}
  #start{gap:7px;justify-content:flex-start;padding-top:22px}   /* 메뉴를 위로 모아, 아래 길 위 주인공 얼굴이 버튼에 가리지 않게 */
  /* 게임 글꼴: 시작 버튼 · 메뉴 타일 · 패널 제목 */

  /* 메뉴 버튼 글씨: 너무 두껍지 않게 기본 글꼴의 굵은 글씨 */
  .g-start,.tile{font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:700}
  .g-start{font-size:26px;letter-spacing:6px}
  .tiles2 .tile{font-size:17px}
  .tiles4 .tile{font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:-.2px;text-shadow:0 1px 1px rgba(0,0,0,.45)}   /* 작은 타일은 또렷한 기본 글꼴 (굵은 게임 글꼴은 작으면 뭉개짐) */
  /* 패널 위쪽 돌아가기: 스크롤해도 왼쪽 위에 붙어 있음 */
  #pbackTop{position:sticky;top:0;align-self:flex-start;z-index:5;font-size:13px;padding:7px 12px;margin:-6px 0 -38px;flex-shrink:0}
  .tabs button.on{background:linear-gradient(var(--c1),var(--c2))}
  /* 패널(상점·내 캐릭터·선행·과제 등) */
  .panel h2,#pause h2,#end h2{font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:23px;font-weight:800;letter-spacing:.5px;color:#ffe58a;text-shadow:0 2px 0 #2a1608,0 0 1px #2a1608,0 4px 8px rgba(0,0,0,.45)}
  #coinline{display:flex;align-items:center;gap:6px;background:linear-gradient(rgba(44,50,92,.95),rgba(22,26,52,.95));border:2px solid #ffc83d;border-radius:22px;padding:2px 14px 2px 5px;box-shadow:0 3px 0 #0c0f22;color:#ffe58a}
  #coinline b{color:#fff;font-size:17px}
  .item{background:linear-gradient(rgba(48,55,100,.96),rgba(30,35,68,.96));border:2px solid #4a5390;box-shadow:0 3px 0 #11142a,inset 0 1px 0 rgba(255,255,255,.12)}
  .item .icon{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:26px;background:radial-gradient(circle at 50% 35%,#5a6ab8,#2a3166);border:2px solid rgba(10,12,30,.5);box-shadow:inset 0 2px 0 rgba(255,255,255,.18)}
  .item button:not(:disabled){--c1:#ffd96e;--c2:#f2a62a;--edge:#a8650f;color:#3a2108;text-shadow:0 1px 0 rgba(255,255,255,.55)}
  .item.done .icon{background:radial-gradient(circle at 50% 35%,#4fd18b,#1f7a4a)}
  img.pic{vertical-align:middle}
  .item .lk{color:#8a92b8;display:inline-flex}
  .cyc{display:flex;align-items:center;gap:6px;background:#222845;border:2px solid #ffd34d;border-radius:12px;padding:8px;width:100%;box-sizing:border-box}
  .cyc .cv{flex:1;text-align:center;font-weight:700;font-size:15px}
  .cyc .cv small{display:block;font-weight:400;font-size:11px;opacity:.75}
  .cyc button{min-width:0;padding:8px 10px;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:3px}
  .cyc button:disabled{opacity:.25;filter:grayscale(1)}
  .look{display:flex;flex-direction:column;align-items:center;gap:2px;background:radial-gradient(circle at 50% 45%,#3a4272,#222845 70%);border:2px solid #ffd34d;border-radius:16px;padding:10px;width:100%;box-sizing:border-box}
  .look canvas{width:160px;height:200px;background:transparent;border-radius:0}
  .look .ln{font-size:17px;font-weight:800;color:#ffe58a}
  .look small{font-size:12px;opacity:.8}
  .kcol{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:6px 0 2px}
  .kcol .sw{width:30px;height:30px;min-width:0;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.35);box-shadow:none}
  .kcol .sw.on{border:3px solid #ffe58a;transform:scale(1.12)}
  .omap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
  .omap .oc{background:#222845;border:2px solid #3a4272;border-radius:10px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;font-size:11px;line-height:1.2;cursor:pointer}
  .omap .oc canvas{width:48px;height:60px;background:transparent;border-radius:0}
  .omap .oc.cur{border-color:#ffd34d;box-shadow:0 0 8px #ffd34d88}
  .omap .oc.lock{opacity:.6}
  .omap .oc .st{color:#ffd34d;font-size:9px;letter-spacing:-1px}
  .omap .oc small{font-size:9px;opacity:.7}
  .book .wn{font-size:12px;text-align:left;white-space:nowrap;display:flex;align-items:center;gap:2px}
  .book .wn .lk{color:#ffd84d;display:inline-flex;width:22px;justify-content:center}
  .item button{min-width:78px;padding:8px 10px;font-size:13px}
  .item button:disabled{opacity:.4;cursor:default}
  .bar{height:6px;background:#0008;border-radius:3px;margin-top:5px;overflow:hidden}
  .bar>i{display:block;height:100%;background:#7dffb2}
  textarea{width:100%;box-sizing:border-box;height:84px;background:#0d0f1a;color:#fff;border:2px solid #3a4272;border-radius:8px;font-size:11px;padding:6px;user-select:text;-webkit-user-select:text;touch-action:auto}
  .msg{font-size:13px;color:#ffd34d;min-height:18px}
  #mute{position:absolute;right:6px;top:5.4%;z-index:5;background:#0004;font-size:13px;padding:3px 7px;min-width:0;border-radius:8px}
  /* 레벨업·조언 카드: 게임을 멈추지 않는 작은 반투명 카드 (아래 조작 영역 = 적이 거의 없는 곳). 빈 곳은 터치가 그대로 게임으로 간다 */
  #cards{position:absolute;left:10px;right:10px;bottom:1.2%;z-index:6;pointer-events:none;display:flex;flex-direction:column;gap:3px}
  #cards.hidden{display:none}
  #cards .ctitle.hidden{display:none}
  #cards .ctitle{font-size:11px;text-align:center;color:#ffe58a;text-shadow:0 1px 2px #000;opacity:.9}
  #cards .crow{display:flex;gap:8px}
  #cards .mini{pointer-events:auto;flex:1;min-width:0;padding:4px 3px;border-radius:12px;background:rgba(30,36,64,.12);border:2px solid rgba(108,140,255,.5);opacity:.6;color:#fff;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.15;touch-action:none;text-shadow:0 1px 2px #000;backdrop-filter:blur(1px)}
  #cards .mini.boon{border-color:rgba(255,211,77,.85)}
  #cards .mini.deed{border-color:rgba(255,140,190,.9)}
  #cards .mini:active{background:rgba(108,140,255,.5)}
  #cards .mini .ic{font-size:24px;line-height:1.1}
  #cards .mini .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  #cards .mini small{font-size:9px;font-weight:400;opacity:.85;white-space:nowrap}
  #cards .ctime{height:3px;background:#0006;border-radius:2px;overflow:hidden}
  #cards .ctime>i{display:block;height:100%;background:#ffd34d}
  #pauseBtn{position:absolute;right:44px;top:5.4%;z-index:5;background:#0004;font-size:13px;padding:3px 7px;min-width:0;border-radius:8px}
  #exitBtn{position:absolute;right:6px;top:calc(5.4% + 36px);z-index:5;background:#0004;font-size:12px;padding:0 9px;height:30px;min-width:0;border-radius:8px;display:flex;align-items:center;gap:4px}   /* 튜토리얼 나가기: 일시정지 옆 */
  .bar{background:#0f1228;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
  .bar i{background:linear-gradient(90deg,#7dffb2,#3fd37a)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas><div id="stage">
  <button id="mute" class="sub" data-icon="soundOn" data-icon-size="17" aria-label="소리 켜기/끄기"></button>
  <button id="pauseBtn" class="sub" style="display:none" data-icon="pause" data-icon-size="17" aria-label="일시정지"></button>
  <div id="soundPop" class="hidden"><div class="vols" data-vols></div><button id="muteAll" class="sub"></button></div>
  <button id="exitBtn" class="sub" style="display:none" data-icon="home" data-icon-size="15" aria-label="튜토리얼 나가기">나가기</button>

  <div id="tutorial" class="overlay hidden">
    <h1>✨ Echo Rush</h1>
    <p>처음 오셨군요! 반가워요 👋</p>
    <p>이 게임에서는 한 판이 끝나면<br><b>그 판의 내가 귀여운 동료(에코)가 되어</b><br>다음 판에서 함께 싸워요.</p>
    <p>먼저 <b>과거의 나 10명</b>과 함께<br>한 판(약 2분)을 체험해 볼까요?</p>
    <p style="font-size:13px">아이템 고르기 · 선생님의 조언 · 선행 · 피하기 · 왕까지<br>게임 중에 하나씩 알려 드릴게요.</p>
    <button id="tStart">📘 튜토리얼 시작</button>
    <button id="tSkip" class="sub">건너뛰기</button>
  </div>

  <div id="pause" class="overlay hidden">
    <h2>일시정지</h2>
    <p id="pauseInfo"></p>
    <button id="resume" data-icon="play">계속하기</button>
    <div class="vols" data-vols></div>
    <button id="quit" class="sub" data-icon="home">그만하고 메뉴로</button>
  </div>

  <div id="start" class="overlay">
    <div class="logo" aria-label="Echo Rush 에코 러시"><span class="lg1">ECHO</span><span class="lg2">RUSH</span><span class="lgk">✨ 에코 러시 ✨</span></div>
    <div style="display:flex;align-items:center;gap:6px"><canvas id="outfitPv" width="168" height="176" style="width:84px;height:88px;background:transparent;border-radius:0;margin:-8px 0 -10px"></canvas><span id="outfitName" style="font-size:13px;color:#ffe58a"></span></div>
    <div id="titleLine" style="font-size:12px;color:#ffb3d4;margin-top:-6px"></div>
    <div id="coinbar" class="pill"><span class="capi"></span> <b id="coins">0</b> 학점</div>
    <button id="bWorld" class="gbtn g-glass">🗺️ 월드</button>
    <button id="go" class="gbtn g-start gloss" data-icon="play" data-icon-color data-icon-size="26">시작</button>
    <div id="echoLine" style="font-size:13px;margin-top:-6px"></div>
    <div class="tiles2"><button id="bShop" class="tile g-gold gloss" data-icon="shop" data-icon-color data-icon-size="34">상점</button><button id="bLook" class="tile g-blue gloss" data-icon="shirt" data-icon-color data-icon-size="34">내 캐릭터</button></div>
    <div id="more" style="display:flex;flex-direction:column;gap:8px;align-items:center">
      <div class="tiles4"><button id="bDeed" class="tile sm g-pink gloss" data-icon="heart" data-icon-color data-icon-size="26">선행</button><button id="bQuest" class="tile sm g-purple gloss" data-icon="trophy" data-icon-color data-icon-size="26">과제·미션</button><button id="bBackup" class="tile sm g-slate gloss" data-icon="save" data-icon-color data-icon-size="26">백업</button><button id="bTutorial" class="tile sm g-teal gloss" data-icon="book" data-icon-color data-icon-size="26">튜토리얼</button></div>
      <button id="bInstall" class="sub" data-icon="install" data-icon-size="16" style="display:none;min-width:0;padding:7px 14px;font-size:13px">홈 화면에 설치</button>
      <div id="dangerHold" hidden><button id="reset" class="sub danger">에코 기록 초기화</button></div>
    </div>
  </div>

  <div id="panel" class="overlay panel hidden">
    <button id="pbackTop" class="sub" aria-label="돌아가기">← 돌아가기</button>
    <h2 id="ptitle"></h2>
    <div id="coinline"><span class="capi"></span> <b id="pcoins">0</b> 학점</div>
    <div id="pbody"></div>
    <button id="pback" class="sub">← 돌아가기</button>
  </div>

  <div id="levelup" class="overlay hidden"><div id="choices"></div></div>
  <div id="cards" class="hidden"></div>

  <div id="end" class="overlay hidden">
    <div id="endBadge" style="font-size:22px;font-weight:900;padding:6px 18px;border-radius:14px;letter-spacing:1px"></div>
    <h2 id="endTitle"></h2>
    <div class="big" id="endEchoes"></div>
    <div id="stats"></div>
    <button id="nextCycle" style="display:none;background:#ff8c42">🔁 다음 회차로 ▶</button>
    <button id="nextWorld" style="display:none;background:#3fbf7f">▶ 다음 월드</button>
    <button id="again">한 판만 더</button>
    <button id="toMenu" style="background:#2f3a66;font-size:16px" data-icon="home">메뉴 · 상점</button>
    <div id="cheer" style="font-size:13px;color:#ffe58a;line-height:1.5;padding:0 8px"></div>
    <div id="reward" class="msg"></div>
  </div>
</div></div>

<script src="src/glyphs.js"></script>
<script src="src/worlds.js"></script>
<script src="src/sim.js"></script>
<script src="src/tutorial.js"></script>
<script src="src/meta.js"></script>
<script src="src/audio.js"></script>
<script src="src/music.js"></script>
<script src="src/art.js"></script>
<script src="src/art-worlds.js"></script>
<script src="src/art-bg.js"></script>
<script src="src/art-bullets.js"></script>
<script src="src/art-echoes.js"></script>
<script src="src/art-menu.js"></script>
<script src="src/icons.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
